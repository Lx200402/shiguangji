<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<title>拾光集 · 记录生活的美好</title>
<style>
/* fonts loaded via link tag in head */
:root{--c-primary:#ff8fa3;--c-primary-light:#ffb7c5;--c-accent:#c8b6ff;--c-mint:#b8e0d2;--c-sky:#a2d2ff;--c-peach:#ffd6a5;--c-bg:#fffaf5;--c-card:#fff;--c-text:#3a3a3a;--c-sub:#999;--c-border:#f0ebe6;--shadow:0 4px 20px rgba(0,0,0,.06);--shadow-hover:0 12px 36px rgba(255,143,163,.18);--radius:16px;--nav-h:64px;--max-w:1200px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Noto Sans SC','Nunito',sans-serif;background:var(--c-bg);color:var(--c-text);line-height:1.7;min-height:100vh;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none;transition:color .2s}
img{max-width:100%;display:block}
button{font-family:inherit;cursor:pointer;border:none;background:none}
ul{list-style:none}

/* ===== Lock Screen ===== */
#lock-screen{position:fixed;inset:0;z-index:9999;background:var(--c-bg);display:flex;justify-content:center;align-items:center;padding:20px;transition:opacity .5s,visibility .5s}
#lock-screen.unlocked{opacity:0;visibility:hidden;pointer-events:none}
.lock-card{background:#fff;border-radius:24px;padding:48px 40px;text-align:center;max-width:400px;width:100%;box-shadow:0 20px 60px rgba(255,183,197,.25);position:relative;overflow:hidden}
.lock-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--c-primary),var(--c-accent),var(--c-sky))}
.lock-icon{font-size:48px;margin-bottom:12px;display:inline-block;animation:lbounce 2s ease-in-out infinite}
@keyframes lbounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.lock-card h2{font-size:24px;font-weight:800;background:linear-gradient(135deg,var(--c-primary),var(--c-accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:6px}
.lock-card .sub{color:var(--c-sub);font-size:13px;margin-bottom:28px}
.lock-input{width:100%;padding:14px 18px;border:2px solid #f0e6ef;border-radius:12px;font-size:17px;text-align:center;letter-spacing:5px;outline:none;background:#fefbfd;color:var(--c-text);transition:.3s;font-family:inherit}
.lock-input:focus{border-color:var(--c-primary-light);box-shadow:0 0 0 4px rgba(255,183,197,.15)}
.lock-input.shake{animation:ishake .4s ease;border-color:#ff6b6b;background:#fff5f5}
@keyframes ishake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
.lock-btn{width:100%;margin-top:14px;padding:14px;border-radius:12px;background:linear-gradient(135deg,var(--c-primary),var(--c-accent));color:#fff;font-size:16px;font-weight:700;letter-spacing:2px;transition:.3s}
.lock-btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(255,143,163,.35)}
.lock-err{min-height:22px;margin-top:12px;font-size:13px;font-weight:600;color:#ff6b6b;opacity:0;transition:.3s}
.lock-err.show{opacity:1}

/* ===== App Container ===== */
#app{display:none}
#app.visible{display:block;animation:fadeUp .6s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

/* ===== Navbar ===== */
.navbar{position:sticky;top:0;z-index:100;background:rgba(255,250,245,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--c-border);height:var(--nav-h)}
.nav-inner{max-width:var(--max-w);margin:0 auto;padding:0 24px;height:100%;display:flex;align-items:center;justify-content:space-between;gap:20px}
.logo{font-size:22px;font-weight:900;background:linear-gradient(135deg,var(--c-primary),var(--c-accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;white-space:nowrap;cursor:pointer}
.nav-links{display:flex;gap:6px}
.nav-links a{padding:8px 16px;border-radius:10px;font-size:14px;font-weight:600;color:var(--c-text);transition:.2s}
.nav-links a:hover,.nav-links a.active{background:var(--c-primary-light);color:#fff}
.search-box{position:relative;flex-shrink:0}
.search-box input{padding:8px 14px 8px 36px;border:1.5px solid var(--c-border);border-radius:10px;font-size:13px;width:180px;outline:none;background:#fff;transition:.3s;font-family:inherit}
.search-box input:focus{border-color:var(--c-primary-light);width:220px}
.search-box::before{content:'🔍';position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:14px}
.hamburger{display:none;font-size:24px;padding:4px}
.role-badge{padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;flex-shrink:0}
.role-user{background:#e8f5e9;color:#4caf50}
.role-admin{background:#fff3e0;color:#ff9800}

/* ===== Hero ===== */
.hero{max-width:var(--max-w);margin:0 auto;padding:32px 24px 0}
.hero-banner{position:relative;border-radius:var(--radius);overflow:hidden;aspect-ratio:21/9;background:#eee}
.hero-banner img{width:100%;height:100%;object-fit:cover}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.5) 0%,transparent 60%);display:flex;align-items:flex-end;padding:32px 40px}
.hero-text{color:#fff}
.hero-text h2{font-size:clamp(22px,4vw,36px);font-weight:800;margin-bottom:8px;text-shadow:0 2px 8px rgba(0,0,0,.3)}
.hero-text p{font-size:clamp(13px,2vw,16px);opacity:.9;text-shadow:0 1px 4px rgba(0,0,0,.3)}
.hero-dots{display:flex;justify-content:center;gap:8px;margin-top:16px}
.hero-dots span{width:8px;height:8px;border-radius:50%;background:var(--c-border);cursor:pointer;transition:.3s}
.hero-dots span.active{background:var(--c-primary);width:24px;border-radius:4px}

/* ===== Category Cards ===== */
.cat-cards{max-width:var(--max-w);margin:0 auto;padding:32px 24px;display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.cat-card{position:relative;border-radius:var(--radius);overflow:hidden;aspect-ratio:16/10;cursor:pointer;transition:.3s}
.cat-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-hover)}
.cat-card img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.cat-card:hover img{transform:scale(1.06)}
.cat-card-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.55),transparent 70%);display:flex;align-items:flex-end;padding:24px}
.cat-card-overlay h3{color:#fff;font-size:20px;font-weight:700}
.cat-card-overlay span{color:rgba(255,255,255,.8);font-size:13px;margin-left:8px}

/* ===== Section Title ===== */
.section-title{max-width:var(--max-w);margin:0 auto;padding:36px 24px 16px;display:flex;align-items:center;justify-content:space-between}
.section-title h3{font-size:22px;font-weight:800;position:relative;padding-left:16px}
.section-title h3::before{content:'';position:absolute;left:0;top:4px;bottom:4px;width:4px;border-radius:2px;background:linear-gradient(to bottom,var(--c-primary),var(--c-accent))}
.section-title a{font-size:13px;color:var(--c-primary);font-weight:600}

/* ===== Content Grid ===== */
.content-grid{max-width:var(--max-w);margin:0 auto;padding:0 24px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.c-card{background:var(--c-card);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);transition:.3s;cursor:pointer;display:flex;flex-direction:column;position:relative}
.c-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-hover)}
.c-card-img{aspect-ratio:16/10;overflow:hidden;position:relative}
.c-card-img img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.c-card:hover .c-card-img img{transform:scale(1.06)}
.c-card-cat{position:absolute;top:12px;left:12px;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;color:#fff;backdrop-filter:blur(4px)}
.cat-scenery{background:rgba(76,175,80,.85)}.cat-food{background:rgba(255,152,0,.85)}.cat-life{background:rgba(66,165,245,.85)}
.c-card-body{padding:16px 18px 20px;flex:1;display:flex;flex-direction:column}
.c-card-title{font-size:16px;font-weight:700;margin-bottom:6px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.c-card-excerpt{font-size:13px;color:var(--c-sub);line-height:1.6;margin-bottom:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex:1}
.c-card-meta{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:#bbb}
.c-card-tags{display:flex;gap:6px;flex-wrap:wrap}
.c-card-tags span{padding:2px 8px;background:var(--c-bg);border-radius:6px;font-size:11px;color:var(--c-sub)}

/* Admin delete btn on card */
.admin-del-btn{position:absolute;top:10px;right:10px;width:30px;height:30px;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);border:none;border-radius:50%;color:#fff;font-size:16px;cursor:pointer;display:none;align-items:center;justify-content:center;z-index:5;transition:.2s}
.admin-del-btn:hover{background:#ff6b6b}
.is-admin .admin-del-btn{display:flex}

/* ===== Hot Tags ===== */
.hot-tags{max-width:var(--max-w);margin:0 auto;padding:0 24px 48px;display:flex;flex-wrap:wrap;gap:10px}
.hot-tag{padding:8px 18px;background:var(--c-card);border:1.5px solid var(--c-border);border-radius:20px;font-size:13px;font-weight:600;color:var(--c-text);cursor:pointer;transition:.2s}
.hot-tag:hover{border-color:var(--c-primary-light);color:var(--c-primary);background:#fff5f7}

/* ===== Sub Filter Bar ===== */
.filter-bar{max-width:var(--max-w);margin:0 auto;padding:24px 24px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filter-btn{padding:8px 20px;border-radius:20px;font-size:13px;font-weight:600;background:var(--c-card);border:1.5px solid var(--c-border);color:var(--c-text);transition:.2s}
.filter-btn:hover,.filter-btn.active{background:var(--c-primary);color:#fff;border-color:var(--c-primary)}

/* ===== Detail Page ===== */
.detail{max-width:800px;margin:0 auto;padding:32px 24px 60px}
.detail-back{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--c-sub);margin-bottom:20px;cursor:pointer;transition:.2s}
.detail-back:hover{color:var(--c-primary)}
.detail-cat{display:inline-block;padding:4px 14px;border-radius:20px;font-size:12px;font-weight:700;color:#fff;margin-bottom:16px}
.detail h1{font-size:clamp(24px,4vw,32px);font-weight:900;line-height:1.4;margin-bottom:16px}
.detail-meta{display:flex;flex-wrap:wrap;gap:16px;font-size:13px;color:var(--c-sub);margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid var(--c-border)}
.detail-cover{border-radius:var(--radius);overflow:hidden;margin-bottom:32px;aspect-ratio:16/9}
.detail-cover img{width:100%;height:100%;object-fit:cover}
.detail-content{font-size:16px;line-height:2;color:#444}
.detail-content p{margin-bottom:20px}
.detail-content img{border-radius:12px;margin:24px 0}
.detail-content h3{font-size:20px;font-weight:700;margin:32px 0 16px;padding-left:14px;border-left:4px solid var(--c-primary)}
.detail-content blockquote{background:#fff5f7;border-left:4px solid var(--c-primary-light);padding:16px 20px;border-radius:0 12px 12px 0;margin:20px 0;font-style:italic;color:#666}
.detail-tags{display:flex;flex-wrap:wrap;gap:8px;margin:32px 0;padding-top:20px;border-top:1px solid var(--c-border)}
.detail-tags span{padding:6px 14px;background:var(--c-bg);border-radius:8px;font-size:13px;color:var(--c-sub);cursor:pointer;transition:.2s}
.detail-tags span:hover{color:var(--c-primary);background:#fff5f7}
.detail-nav{display:flex;justify-content:space-between;gap:16px;margin:32px 0;padding:20px 0;border-top:1px solid var(--c-border);border-bottom:1px solid var(--c-border)}
.detail-nav-item{flex:1;cursor:pointer;transition:.2s}
.detail-nav-item:hover .dn-title{color:var(--c-primary)}
.detail-nav-item.prev{text-align:left}
.detail-nav-item.next{text-align:right}
.dn-label{font-size:12px;color:#bbb;margin-bottom:4px}
.dn-title{font-size:14px;font-weight:600}
.related-section{margin-top:40px}
.related-section h3{font-size:18px;font-weight:700;margin-bottom:20px}
.detail-admin-bar{display:flex;gap:10px;margin-bottom:20px}
.detail-admin-bar button{padding:8px 20px;border-radius:10px;font-size:13px;font-weight:600;transition:.2s}
.btn-edit{background:#fff3e0;color:#ff9800;border:1.5px solid #ffe0b2}
.btn-edit:hover{background:#ff9800;color:#fff}
.btn-delete{background:#ffebee;color:#e53935;border:1.5px solid #ffcdd2}
.btn-delete:hover{background:#e53935;color:#fff}

/* ===== About Page ===== */
.about{max-width:800px;margin:0 auto;padding:40px 24px 60px}
.about-header{text-align:center;margin-bottom:40px}
.about-avatar{width:100px;height:100px;border-radius:50%;margin:0 auto 16px;overflow:hidden;border:3px solid var(--c-primary-light)}
.about-avatar img{width:100%;height:100%;object-fit:cover}
.about-header h2{font-size:28px;font-weight:800;margin-bottom:8px}
.about-header p{color:var(--c-sub);font-size:15px}
.about-section{background:var(--c-card);border-radius:var(--radius);padding:32px;margin-bottom:20px;box-shadow:var(--shadow)}
.about-section h3{font-size:18px;font-weight:700;margin-bottom:16px;padding-left:14px;border-left:4px solid var(--c-primary)}
.about-section p{font-size:15px;color:#555;margin-bottom:12px;line-height:1.8}
.contact-links{display:flex;flex-wrap:wrap;gap:12px;margin-top:16px}
.contact-link{padding:10px 20px;background:var(--c-bg);border-radius:10px;font-size:14px;font-weight:600;transition:.2s}
.contact-link:hover{background:var(--c-primary-light);color:#fff}

/* ===== Search Results ===== */
.search-page{max-width:var(--max-w);margin:0 auto;padding:32px 24px 60px}
.search-page h2{font-size:24px;font-weight:800;margin-bottom:8px}
.search-page .result-info{color:var(--c-sub);font-size:14px;margin-bottom:24px}
.tag-cloud{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:40px}
.tag-cloud-item{padding:10px 20px;background:var(--c-card);border:1.5px solid var(--c-border);border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;transition:.2s}
.tag-cloud-item:hover{border-color:var(--c-primary);color:var(--c-primary)}
.tag-cloud-item .count{font-size:11px;color:#bbb;margin-left:6px}

/* ===== Load More ===== */
.load-more-wrap{text-align:center;padding:20px 0 48px}
.load-more-btn{padding:12px 40px;border-radius:24px;background:var(--c-card);border:1.5px solid var(--c-border);font-size:14px;font-weight:600;color:var(--c-text);transition:.2s}
.load-more-btn:hover{border-color:var(--c-primary);color:var(--c-primary)}

/* ===== Footer ===== */
.site-footer{background:#fff;border-top:1px solid var(--c-border);padding:40px 24px 32px}
.footer-inner{max-width:var(--max-w);margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:32px}
.footer-col h4{font-size:15px;font-weight:700;margin-bottom:14px;color:var(--c-text)}
.footer-col a,.footer-col p{display:block;font-size:13px;color:var(--c-sub);margin-bottom:8px;transition:.2s}
.footer-col a:hover{color:var(--c-primary)}
.footer-bottom{max-width:var(--max-w);margin:24px auto 0;padding-top:20px;border-top:1px solid var(--c-border);text-align:center;font-size:12px;color:#ccc}

/* ===== Empty State ===== */
.empty-state{text-align:center;padding:80px 20px;color:var(--c-sub)}
.empty-state .icon{font-size:56px;margin-bottom:16px;opacity:.4}
.empty-state p{font-size:16px}

/* ===== Mobile Nav ===== */
.mobile-menu{display:none;position:fixed;top:var(--nav-h);left:0;right:0;background:#fff;border-bottom:1px solid var(--c-border);padding:16px 24px;z-index:99;flex-direction:column;gap:4px}
.mobile-menu.open{display:flex}
.mobile-menu a{padding:12px 16px;border-radius:10px;font-size:15px;font-weight:600}
.mobile-menu a:hover,.mobile-menu a.active{background:var(--c-primary-light);color:#fff}

/* ===== Admin Add Button (FAB) ===== */
.fab-add{position:fixed;bottom:32px;right:32px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--c-primary),var(--c-accent));color:#fff;font-size:28px;display:none;align-items:center;justify-content:center;box-shadow:0 6px 24px rgba(255,143,163,.4);z-index:50;transition:.3s}
.fab-add:hover{transform:scale(1.1);box-shadow:0 8px 32px rgba(255,143,163,.5)}
.is-admin .fab-add{display:flex}

/* ===== Modal ===== */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);z-index:200;justify-content:center;align-items:flex-start;padding:40px 20px;overflow-y:auto}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:20px;max-width:640px;width:100%;padding:36px;box-shadow:0 20px 60px rgba(0,0,0,.2);animation:modalIn .3s ease}
@keyframes modalIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.modal h2{font-size:22px;font-weight:800;margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid var(--c-border)}
.form-group{margin-bottom:18px}
.form-group label{display:block;font-size:13px;font-weight:600;color:var(--c-sub);margin-bottom:6px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 14px;border:1.5px solid var(--c-border);border-radius:10px;font-size:14px;font-family:inherit;outline:none;transition:.2s;background:#fff;color:var(--c-text)}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--c-primary-light);box-shadow:0 0 0 3px rgba(255,183,197,.12)}
.form-group textarea{min-height:120px;resize:vertical;line-height:1.7}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:24px;padding-top:16px;border-top:1px solid var(--c-border)}
.form-actions button{padding:10px 28px;border-radius:10px;font-size:14px;font-weight:600;transition:.2s}
.btn-cancel{background:var(--c-bg);color:var(--c-sub);border:1.5px solid var(--c-border)}
.btn-cancel:hover{background:#eee}
.btn-save{background:linear-gradient(135deg,var(--c-primary),var(--c-accent));color:#fff}
.btn-save:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(255,143,163,.3)}
.img-preview{margin-top:8px;border-radius:10px;overflow:hidden;max-height:200px;display:none}
.img-preview img{width:100%;height:100%;object-fit:cover}
.img-preview.show{display:block}

/* ===== Toast ===== */
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);background:#333;color:#fff;padding:12px 28px;border-radius:10px;font-size:14px;z-index:300;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ===== Responsive ===== */
@media(max-width:768px){
  .nav-links,.search-box{display:none}
  .hamburger{display:block}
  .cat-cards{grid-template-columns:1fr;gap:14px}
  .hero-banner{aspect-ratio:16/9}
  .hero-overlay{padding:20px}
  .content-grid{grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
  .footer-inner{grid-template-columns:1fr 1fr}
  .detail-nav{flex-direction:column}
  .form-row{grid-template-columns:1fr}
  .modal{padding:24px}
}
@media(max-width:480px){
  .content-grid{grid-template-columns:1fr}
  .footer-inner{grid-template-columns:1fr}
  .filter-bar{gap:6px}
  .filter-btn{padding:6px 14px;font-size:12px}
}
</style>
</head>
<body>

<!-- Lock Screen -->
<div id="lock-screen">
  <div class="lock-card">
    <div class="lock-icon">🔐</div>
    <h2>拾光集</h2>
    <p class="sub">请输入密码访问</p>
    <input type="password" class="lock-input" id="pwd-input" placeholder="请输入密码" maxlength="20">
    <button class="lock-btn" id="login-btn">✨ 进入</button>
    <div class="lock-err" id="pwd-error">❌ 密码错误，请重新输入</div>
  </div>
</div>

<!-- App -->
<div id="app">
  <nav class="navbar">
    <div class="nav-inner">
      <div class="logo" onclick="navigate('home')">🌿 拾光集</div>
      <div class="nav-links" id="nav-links"></div>
      <div class="search-box"><input type="text" placeholder="搜索内容..." id="search-input" onkeyup="if(event.key==='Enter')doSearch()"></div>
      <span class="role-badge" id="role-badge"></span>
      <button class="hamburger" onclick="toggleMobile()">☰</button>
    </div>
  </nav>
  <div class="mobile-menu" id="mobile-menu"></div>
  <main id="page-container"></main>

// API helpers
function apiAddPost(post, callback){
  fetch('/api/posts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(post)})
  .then(function(r){return r.json()}).then(function(saved){if(callback)callback(saved)}).catch(function(e){showToast('保存失败');if(callback)callback(null)});
}

function apiUpdatePost(id, post, callback){
  fetch('/api/posts/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(post)})
  .then(function(r){return r.json()}).then(function(saved){if(callback)callback(saved)}).catch(function(e){showToast('更新失败');if(callback)callback(null)});
}

function apiDeletePost(id, callback){
  fetch('/api/posts/'+id,{method:'DELETE'})
  .then(function(r){return r.json()}).then(function(){if(callback)callback(true)}).catch(function(e){showToast('删除失败');if(callback)callback(false)});
}

function apiReset(callback){
  fetch('/api/reset',{method:'POST'})
  .then(function(r){return r.json()}).then(function(){if(callback)callback()}).catch(function(e){showToast('重置失败')});
}

// PASSWORD (dual role)
// =============================================
function verifyPwd(){
  var inp=document.getElementById('pwd-input'),err=document.getElementById('pwd-error');
  var val=inp.value;
  if(val==='141533'){
    role='user';unlockApp();
  }else if(val==='318952'){
    role='admin';unlockApp();
  }else{
    inp.classList.add('shake');err.classList.add('show');
    setTimeout(function(){inp.classList.remove('shake')},400);
    inp.value='';inp.focus();
  }
}

function unlockApp(){
  document.getElementById('pwd-error').classList.remove('show');
  document.getElementById('lock-screen').classList.add('unlocked');
  var app=document.getElementById('app');
  app.classList.add('visible');
  if(role==='admin'){app.classList.add('is-admin');document.getElementById('fab-reset').style.display='flex';}
  var badge=document.getElementById('role-badge');
  if(role==='admin'){badge.textContent='👑 管理员';badge.className='role-badge role-admin';}
  else{badge.textContent='👤 访客';badge.className='role-badge role-user';}
  loadPosts(function(){initApp()});
}

// ROUTER
// =============================================
function navigate(page,arg,arg2){
  state.page=page;
  if(page==='category'){state.cat=arg;state.sub='全部';state.loadedCount=6;}
  if(page==='detail'){state.postId=arg;}
  if(page==='search'){state.query=arg||'';state.tag=arg2||null;}
  window.scrollTo(0,0);renderPage();updateNav();closeMobile();
}

function initApp(){renderNav();renderPage();updateNav();}

// =============================================
// NAV
// =============================================
function renderNav(){
  var nl=document.getElementById('nav-links'),mm=document.getElementById('mobile-menu'),h='';
  for(var i=0;i<NAV_ITEMS.length;i++){
    var n=NAV_ITEMS[i];
    var href=n.type==='category'?"navigate('category','"+n.key+"')":"navigate('"+n.key+"')";
    h+='<a href="javascript:void(0)" data-key="'+n.key+'" onclick="'+href+'">'+n.label+'</a>';
  }
  nl.innerHTML=h;mm.innerHTML=h;
}

function updateNav(){
  var links=document.querySelectorAll('.nav-links a, .mobile-menu a');
  for(var i=0;i<links.length;i++){
    var k=links[i].getAttribute('data-key'),active=false;
    if(state.page==='home'&&k==='home')active=true;
    if(state.page==='category'&&state.cat===k)active=true;
    if(state.page==='about'&&k==='about')active=true;
    links[i].className=active?'active':'';
  }
}

function toggleMobile(){document.getElementById('mobile-menu').classList.toggle('open')}
function closeMobile(){document.getElementById('mobile-menu').classList.remove('open')}

    case 'detail':c.innerHTML=renderDetail();break;
    case 'about':c.innerHTML=renderAbout();break;
    case 'search':c.innerHTML=renderSearch();break;
    default:c.innerHTML=renderHome();startHeroTimer();
  }
}

// =============================================
// HOME PAGE
// =============================================
var heroIdx=0,heroTimer=null;
function getHeroSlides(){
  // Dynamically build hero slides from the latest post in each category
  var slides=[];
  for(var i=0;i<CATEGORIES.length;i++){
    var cat=CATEGORIES[i];
    var posts=getCatPosts(cat.key,'全部');
    if(posts.length>0 && posts[0].cover){
      slides.push({img:posts[0].cover,title:posts[0].title,desc:posts[0].excerpt||''});
    }
  }
  // Fallback to defaults if no posts
  if(slides.length===0) return HERO_SLIDES;
  return slides;
}
function startHeroTimer(){clearInterval(heroTimer);heroIdx=0;var slides=getHeroSlides();heroTimer=setInterval(function(){heroIdx=(heroIdx+1)%slides.length;updateHero()},4000)}
function updateHero(){
  var slides=getHeroSlides();
  if(heroIdx>=slides.length)heroIdx=0;
  var s=slides[heroIdx],img=document.getElementById('hero-img'),t=document.getElementById('hero-title'),d=document.getElementById('hero-desc');
  if(img){img.src=s.img;t.textContent=s.title;d.textContent=s.desc;}
  var dots=document.querySelectorAll('.hero-dots span');
  for(var i=0;i<dots.length;i++)dots[i].className=i===heroIdx?'active':'';
}
function goHero(i){heroIdx=i;updateHero();clearInterval(heroTimer);var slides=getHeroSlides();heroTimer=setInterval(function(){heroIdx=(heroIdx+1)%slides.length;updateHero()},4000)}

function renderHome(){
  var slides=getHeroSlides();
  if(heroIdx>=slides.length)heroIdx=0;
  var s=slides[heroIdx],dotsH='';
  for(var d=0;d<slides.length;d++)dotsH+='<span class="'+(d===heroIdx?'active':'')+'" onclick="goHero('+d+')"></span>';

  // Category cards - use the latest post cover from each category
  var catH='';
  for(var i=0;i<CATEGORIES.length;i++){
    var c=CATEGORIES[i];
    var catPosts=getCatPosts(c.key,'全部');
    var catCover=catPosts.length>0?catPosts[0].cover:c.cover;
    if(!catCover)catCover=c.cover;
    catH+='<div class="cat-card" onclick="navigate(\'category\',\''+c.key+'\')"><img src="'+catCover+'" alt="'+c.label+'" onerror="this.src=\''+c.cover+'\'"><div class="cat-card-overlay"><h3>'+c.icon+' '+c.label+'</h3><span>'+catPosts.length+'篇</span></div></div>';
  }

  // Per-category sections: each category shows its latest 4 posts
  var catSections='';
  for(var j=0;j<CATEGORIES.length;j++){
    var cat=CATEGORIES[j];
    var posts=getCatPosts(cat.key,'全部').slice(0,4);
    if(posts.length>0){
      catSections+='<div class="section-title"><h3>'+cat.icon+' '+cat.label+' · 最新</h3><a href="javascript:void(0)" onclick="navigate(\'category\',\''+cat.key+'\')">查看全部 →</a></div>';
      catSections+='<div class="content-grid">'+renderCardGrid(posts)+'</div>';
    }
  }

  var tagsH=renderHotTags();
  return '<div class="hero"><div class="hero-banner"><img id="hero-img" src="'+s.img+'" alt="hero"><div class="hero-overlay"><div class="hero-text"><h2 id="hero-title">'+s.title+'</h2><p id="hero-desc">'+s.desc+'</p></div></div></div><div class="hero-dots">'+dotsH+'</div></div>'
    +'<div class="cat-cards">'+catH+'</div>'
    +catSections
    +'<div class="section-title"><h3>热门标签</h3></div><div class="hot-tags">'+tagsH+'</div>';
}

// =============================================
// CATEGORY PAGE
// =============================================
function renderCategory(){
  var catObj=getCat(state.cat);
  if(!catObj)return '<div class="empty-state"><div class="icon">🔍</div><p>分类不存在</p></div>';
  var filterH='<div class="filter-bar">';
  for(var i=0;i<catObj.subs.length;i++){var sub=catObj.subs[i],active=state.sub===sub?' active':'';filterH+='<button class="filter-btn'+active+'" onclick="filterSub(\''+sub+'\')">'+sub+'</button>';}
  filterH+='</div>';
  var posts=getCatPosts(state.cat,state.sub),display=posts.slice(0,state.loadedCount);
  var gridH=display.length?renderCardGrid(display):'<div class="empty-state"><div class="icon">📭</div><p>暂无内容</p></div>';
  var moreH=display.length<posts.length?'<div class="load-more-wrap"><button class="load-more-btn" onclick="loadMore()">加载更多</button></div>':'';
  return '<div class="section-title"><h3>'+catObj.icon+' '+catObj.label+'</h3></div>'
    +'<p style="max-width:var(--max-w);margin:0 auto;padding:0 24px 8px;color:var(--c-sub);font-size:14px">'+catObj.desc+'</p>'
    +filterH+'<div class="content-grid" style="margin-top:20px">'+gridH+'</div>'+moreH;
}
function filterSub(sub){state.sub=sub;state.loadedCount=6;renderPage()}
function loadMore(){state.loadedCount+=6;renderPage()}

// =============================================
// DETAIL PAGE
// =============================================
function renderDetail(){
  var post=getPost(state.postId);
  if(!post)return '<div class="empty-state"><div class="icon">🔍</div><p>内容不存在</p></div>';
  var catObj=getCat(post.cat),catClass='cat-'+post.cat,meta=post.date;
  if(post.location)meta+=' · 📍 '+post.location;
  if(post.season)meta+=' · 🍂 '+post.season;
  var adminBar='';
  if(role==='admin'){
    adminBar='<div class="detail-admin-bar"><button class="btn-edit" onclick="openEditModal('+post.id+')">✏️ 编辑</button><button class="btn-delete" onclick="deletePost('+post.id+')">🗑️ 删除</button></div>';
  }
  var tagsH='';for(var t=0;t<post.tags.length;t++)tagsH+='<span onclick="navigate(\'search\',null,\''+post.tags[t]+'\')">#'+post.tags[t]+'</span>';
  var navPosts=getAdjacentPosts(post.id),navH='<div class="detail-nav">';
  if(navPosts.prev)navH+='<div class="detail-nav-item prev" onclick="navigate(\'detail\','+navPosts.prev.id+')"><div class="dn-label">← 上一篇</div><div class="dn-title">'+navPosts.prev.title+'</div></div>';else navH+='<div></div>';
  if(navPosts.next)navH+='<div class="detail-nav-item next" onclick="navigate(\'detail\','+navPosts.next.id+')"><div class="dn-label">下一篇 →</div><div class="dn-title">'+navPosts.next.title+'</div></div>';
  navH+='</div>';
  var related=getRelatedPosts(post).slice(0,3),relH='';
  if(related.length)relH='<div class="related-section"><h3>相关推荐</h3><div class="content-grid">'+renderCardGrid(related)+'</div></div>';
  return '<div class="detail">'+adminBar
    +'<div class="detail-back" onclick="navigate(state.cat?\'category\':\'home\',state.cat)">← 返回列表</div>'
    +'<span class="detail-cat '+catClass+'">'+(catObj?catObj.label:'')+(post.sub&&post.sub!=='全部'?' · '+post.sub:'')+'</span>'
    +'<h1>'+post.title+'</h1><div class="detail-meta">'+meta+'</div>'
    +'<div class="detail-cover"><img src="'+(post.cover||'https://images.unsplash.com/photo-1472214103451-9374bd1c798e?w=800&q=80')+'" alt="'+post.title+'" onerror="this.src=\'https://images.unsplash.com/photo-1472214103451-9374bd1c798e?w=800&q=80\'"></div>'
    +'<div class="detail-content">'+post.content+'</div>'
    +'<div class="detail-tags">'+tagsH+'</div>'+navH+relH+'</div>';
}

// =============================================
// SEARCH / TAG PAGE
// =============================================
function doSearch(){var q=document.getElementById('search-input').value.trim();if(q)navigate('search',q);}

function renderSearch(){
  var results=[];
  if(state.tag){results=getPostsByTag(state.tag);}
  else if(state.query){results=getPostsByQuery(state.query);}
  else{
    var allTags=getAllTags(),cloudH='';
    for(var i=0;i<allTags.length;i++)cloudH+='<div class="tag-cloud-item" onclick="navigate(\'search\',null,\''+allTags[i].tag+'\')">#'+allTags[i].tag+'<span class="count">'+allTags[i].count+'</span></div>';
    return '<div class="search-page"><h2>🏷️ 标签云</h2><p class="result-info">点击标签查看相关内容</p><div class="tag-cloud">'+cloudH+'</div><div class="section-title"><h3>全部内容</h3></div><div class="content-grid">'+renderCardGrid(getSortedPosts())+'</div></div>';
  }
  var title=state.tag?'标签: #'+state.tag:'搜索: "'+state.query+'"',info='找到 '+results.length+' 条结果';
  var gridH=results.length?renderCardGrid(results):'<div class="empty-state"><div class="icon">🔍</div><p>没有找到相关内容</p></div>';
  return '<div class="search-page"><h2>'+title+'</h2><p class="result-info">'+info+'</p>'+gridH+'</div>';
}

// =============================================
// ADMIN: ADD / EDIT / DELETE
// =============================================
function openAddModal(){
  editingId=null;
  document.getElementById('modal-title').textContent='添加新内容';
  document.getElementById('f-title').value='';
  document.getElementById('f-cat').value='scenery';
  updateSubOptions();
  document.getElementById('f-sub').value='全部';
  document.getElementById('f-cover').value='';
  document.getElementById('cover-preview').classList.remove('show');
  document.getElementById('f-excerpt').value='';
  document.getElementById('f-content').value='';
  document.getElementById('f-tags').value='';
  document.getElementById('f-location').value='';
  document.getElementById('modal-overlay').classList.add('open');
}

function openEditModal(id){
  var post=getPost(id);if(!post)return;
  editingId=id;
  document.getElementById('modal-title').textContent='编辑内容';
  document.getElementById('f-title').value=post.title;
  document.getElementById('f-cat').value=post.cat;
  updateSubOptions();
  document.getElementById('f-sub').value=post.sub||'全部';
  document.getElementById('f-cover').value='';
  if(post.cover){
    document.getElementById('cover-preview-img').src=post.cover;
    document.getElementById('cover-preview').classList.add('show');
  }else{document.getElementById('cover-preview').classList.remove('show');}
  document.getElementById('f-excerpt').value=post.excerpt||'';
  document.getElementById('f-content').value=post.content?post.content.replace(/<[^>]*>/g,''):'';
  document.getElementById('f-tags').value=post.tags?post.tags.join(', '):'';
  document.getElementById('f-location').value=post.location||'';
  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal(){document.getElementById('modal-overlay').classList.remove('open');editingId=null;}

function updateSubOptions(){
  var catKey=document.getElementById('f-cat').value,catObj=getCat(catKey),sel=document.getElementById('f-sub');
  sel.innerHTML='';
  if(catObj){for(var i=0;i<catObj.subs.length;i++){var o=document.createElement('option');o.value=catObj.subs[i];o.textContent=catObj.subs[i];sel.appendChild(o);}}
}

function previewCover(input){
  var prev=document.getElementById('cover-preview'),img=document.getElementById('cover-preview-img');
  if(input.files&&input.files[0]){
    compressImage(input.files[0], 400, 0.7, function(dataUrl){
      img.src=dataUrl;prev.classList.add('show');
    });
  }else{prev.classList.remove('show');}
}

// Compress image using Canvas: maxWidth in px, quality 0-1
function compressImage(file, maxWidth, quality, callback){
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var w=img.width, h=img.height;
      if(w>maxWidth){h=Math.round(h*maxWidth/w);w=maxWidth;}
      var canvas=document.createElement('canvas');
      canvas.width=w;canvas.height=h;
      var ctx=canvas.getContext('2d');
      ctx.drawImage(img,0,0,w,h);
      var dataUrl=canvas.toDataURL('image/jpeg',quality);
      callback(dataUrl);
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

function savePost(){
  var title=document.getElementById('f-title').value.trim();
  if(!title){showToast('请输入标题');return;}
  var cat=document.getElementById('f-cat').value;
  var sub=document.getElementById('f-sub').value;
  var excerpt=document.getElementById('f-excerpt').value.trim();
  var contentRaw=document.getElementById('f-content').value.trim();
  var tagsStr=document.getElementById('f-tags').value.trim();
  var location=document.getElementById('f-location').value.trim();
  var tags=tagsStr?tagsStr.split(/[,，]/).map(function(t){return t.trim()}).filter(Boolean):[];
  var content='<p>'+contentRaw.replace(/\n\n/g,'</p><p>').replace(/\n/g,'<br>')+'</p>';
  var coverFile=document.getElementById('f-cover').files[0];

  function doSave(postData, isEdit){
    if(isEdit){
      apiUpdatePost(editingId, postData, function(saved){
        if(saved){closeModal();loadPosts(function(){renderPage();showToast('已更新')})}
      });
    }else{
      apiAddPost(postData, function(saved){
        if(saved){closeModal();loadPosts(function(){renderPage();showToast('已添加')})}
      });
    }
  }

  if(editingId){
    var post=getPost(editingId);
    if(post){
      var updateData={title:title,cat:cat,sub:sub,excerpt:excerpt,content:content,tags:tags,location:location};
      if(coverFile){
        compressImage(coverFile, 1600, 0.85, function(dataUrl){
          updateData.cover=dataUrl;doSave(updateData,true);
        });
      }else{doSave(updateData,true);}
    }
  }else{
    var newPost={title:title,cat:cat,sub:sub,cover:'',excerpt:excerpt||title,content:content,tags:tags,date:new Date().toISOString().slice(0,10),location:location};
    if(coverFile){
      compressImage(coverFile, 1600, 0.85, function(dataUrl){
        newPost.cover=dataUrl;doSave(newPost,false);
      });
    }else{doSave(newPost,false);}
  }
}

function deletePost(id){
  var post=getPost(id);if(!post)return;
  if(!confirm('确定要删除「'+post.title+'」吗？'))return;
  apiDeletePost(id, function(ok){
    if(ok){showToast('已删除');loadPosts(function(){navigate(state.cat?'category':'home',state.cat)})}
  });
}

// =============================================
// HELPERS
// =============================================
function getCat(key){for(var i=0;i<CATEGORIES.length;i++)if(CATEGORIES[i].key===key)return CATEGORIES[i];return null}
function getPost(id){for(var i=0;i<POSTS.length;i++)if(POSTS[i].id===id)return POSTS[i];return null}
function getCatCount(key){var c=0;for(var i=0;i<POSTS.length;i++)if(POSTS[i].cat===key)c++;return c}
function getSortedPosts(){return POSTS.slice().sort(function(a,b){return b.date.localeCompare(a.date)})}
function getCatPosts(cat,sub){var r=[],all=getSortedPosts();for(var i=0;i<all.length;i++){if(all[i].cat===cat&&(sub==='全部'||all[i].sub===sub))r.push(all[i])}return r}
function getAdjacentPosts(id){var sorted=getSortedPosts(),idx=-1;for(var i=0;i<sorted.length;i++)if(sorted[i].id===id){idx=i;break}return{prev:idx<sorted.length-1?sorted[idx+1]:null,next:idx>0?sorted[idx-1]:null}}
function getRelatedPosts(post){var r=[],sorted=getSortedPosts();for(var i=0;i<sorted.length;i++){if(sorted[i].id!==post.id&&sorted[i].cat===post.cat)r.push(sorted[i]);if(r.length>=3)break}return r}
function getPostsByTag(tag){var r=[];for(var i=0;i<POSTS.length;i++){if(POSTS[i].tags.indexOf(tag)!==-1)r.push(POSTS[i])}return r.sort(function(a,b){return b.date.localeCompare(a.date)})}
function getPostsByQuery(q){var ql=q.toLowerCase(),r=[];for(var i=0;i<POSTS.length;i++){var p=POSTS[i];if(p.title.toLowerCase().indexOf(ql)!==-1||p.excerpt.toLowerCase().indexOf(ql)!==-1||p.tags.join(' ').toLowerCase().indexOf(ql)!==-1||(p.content&&p.content.toLowerCase().indexOf(ql)!==-1))r.push(p)}return r.sort(function(a,b){return b.date.localeCompare(a.date)})}
function getAllTags(){var map={};for(var i=0;i<POSTS.length;i++){for(var j=0;j<POSTS[i].tags.length;j++){var t=POSTS[i].tags[j];map[t]=(map[t]||0)+1}}var arr=[];for(var k in map)arr.push({tag:k,count:map[k]});return arr.sort(function(a,b){return b.count-a.count})}

function renderCardGrid(posts){
  var h='',isAdmin=role==='admin';
  var placeholder='https://images.unsplash.com/photo-1472214103451-9374bd1c798e?w=800&q=80';
  for(var i=0;i<posts.length;i++){
    var p=posts[i],catClass='cat-'+p.cat,catLabel=getCat(p.cat)?getCat(p.cat).label:p.cat;
    var coverSrc=p.cover||placeholder;
    var tagsH='';for(var t=0;t<Math.min(p.tags.length,3);t++)tagsH+='<span>#'+p.tags[t]+'</span>';
    var delBtn=isAdmin?'<button class="admin-del-btn" onclick="event.stopPropagation();deletePost('+p.id+')" title="删除">✕</button>':'';
    h+='<div class="c-card" onclick="navigate(\'detail\','+p.id+')">'+delBtn
      +'<div class="c-card-img"><img src="'+coverSrc+'" alt="'+p.title+'" loading="lazy" onerror="this.src=\''+placeholder+'\'"><span class="c-card-cat '+catClass+'">'+catLabel+'</span></div>'
      +'<div class="c-card-body"><div class="c-card-title">'+p.title+'</div><div class="c-card-excerpt">'+(p.excerpt||'')+'</div><div class="c-card-meta"><div class="c-card-tags">'+tagsH+'</div><span>'+p.date+'</span></div></div></div>';
  }
  return h;
}

function renderHotTags(){
  var tags=getAllTags().slice(0,12),h='';
  for(var i=0;i<tags.length;i++)h+='<span class="hot-tag" onclick="navigate(\'search\',null,\''+tags[i].tag+'\')">#'+tags[i].tag+'</span>';
  return h;
}

function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2500)}

function resetAllData(){
  if(!confirm('确定要重置所有数据吗？这将删除所有添加的内容，恢复为默认状态。'))return;
  apiReset(function(){loadPosts(function(){showToast('已重置为默认数据');navigate('home')})});
}
